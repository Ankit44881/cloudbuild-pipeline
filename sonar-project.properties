sonar.projectKey=chai-politics
sonar.projectName=Chai Politics Application
sonar.projectVersion=1.0

# Scan directories
sonar.sources=backend

# Exclusions (Excludes virtual environments, tests, and non-code directories)
sonar.exclusions=**/venv/**, **/tests/**, **/database/**, **/test_app.py

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Quality Gate Result Check 
sonar.qualitygate.wait=true

# Path to the unit test coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml