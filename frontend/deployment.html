<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Details - Chai Politics</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
            NAVBAR
    ========================== -->

    <nav>
        <div class="logo">
            <img src="images/logo.jpeg" alt="Chai Politics Logo">
            <span>CHAI POLITICS</span>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="deployment.html" style="color:#ff6600;">Deployment</a></li>
        </ul>
    </nav>

    <!-- =========================
        DEPLOYMENT INFORMATION
    ========================== -->

    <div class="container">
        <section class="deployment-info">
            <h2>Deployment Information</h2>

            <div class="deploy-card">
                <p><strong>Application:</strong> <span id="app">Loading...</span></p>
                <p><strong>Version:</strong> <span id="version">Loading...</span></p>
                <p><strong>Image Tag:</strong> <span id="imageTag">Loading...</span></p>
                <p><strong>Commit:</strong> <span id="commit">Loading...</span></p>
                <p><strong>Environment:</strong> <span id="environment">Loading...</span></p>
                <p><strong>Cluster:</strong> <span id="cluster">Loading...</span></p>
                <p><strong>Deployed At:</strong> <span id="deployedAt">Loading...</span></p>
            </div>
        </section>
    </div>

    <!-- =========================
            LOGIN MODAL
    ========================== -->
    <div id="loginModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔑 Login / Register</h3>
                <button class="close-btn" onclick="closeLoginModal()">✕</button>
            </div>
            <div class="modal-body" style="padding: 15px 0;">
                <form onsubmit="handleLogin(event)">
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Name</label>
                        <input type="text" id="loginName" required placeholder="Enter your name" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Phone Number</label>
                        <input type="tel" id="loginPhone" required placeholder="Enter phone number" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
                    </div>
                    <button type="submit" class="checkout-btn">Login to Continue</button>
                </form>
            </div>
        </div>
    </div>

    <!-- =========================
            CART MODAL
    ========================== -->
    <div id="cartModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛍️ Your Cart Items</h3>
                <button class="close-btn" onclick="closeCartModal()">✕</button>
            </div>
            <div class="modal-body">
                <ul id="cartItemsList" class="cart-item-list">
                    <!-- Dynamic Cart Rows Rendered Here -->
                </ul>
            </div>
            <div class="modal-footer">
                <div class="total-section">
                    <span>Grand Total:</span>
                    <span id="cartTotalAmount">₹0.00</span>
                </div>
                <button class="checkout-btn" onclick="alert('Order Placed Successfully!')">Confirm Order 🚀</button>
            </div>
        </div>
    </div>

    <!-- =========================
        LOAD VERSION.JSON
    ========================== -->
    <script>
        fetch("version.json")
            .then(response => response.json())
            .then(data => {
                document.getElementById("app").innerText = data.application || "-";
                document.getElementById("version").innerText = data.version || "-";
                document.getElementById("imageTag").innerText = data.imageTag || "-";
                document.getElementById("commit").innerText = data.commit || "-";
                document.getElementById("environment").innerText = data.environment || "-";
                document.getElementById("cluster").innerText = data.cluster || "-";
                document.getElementById("deployedAt").innerText = data.deployedAt || "-";
            })
            .catch(error => {
                console.error("Unable to load version.json", error);
            });
    </script>

    <!-- Global JS App Script -->
    <script src="js/app.js"></script>
</body>

</html>
