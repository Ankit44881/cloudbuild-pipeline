<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Politics Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .add-cart-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        .add-cart-btn:hover {
            background-color: #e65c00;
        }
    </style>
</head>

<body>

    <!-- =========================
            NAVBAR
    ========================== -->
    <nav>
        <div class="logo">
            <img src="images/logo.jpeg" alt="Chai Politics Logo">
            <span>CHAI POLITICS</span>
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html" style="color:#ff6600;">Menu</a></li>
            <li><a href="deployment.html">Deployment</a></li>
            <!-- Dynamic Login / Cart button rendered by js/app.js -->
        </ul>
    </nav>

    <!-- =========================
            MENU SECTION
    ========================== -->
    <div class="container">

        <section class="menu-section">
            <h2>🍽️ Our Special Menu</h2>
            
            <!-- Category Filter Buttons -->
            <div style="text-align:center; margin:30px 0;">
                <button class="btn" onclick="filterMenu('all')">All Items</button>
                <button class="btn" onclick="filterMenu('tea')">☕ Tea</button>
                <button class="btn" onclick="filterMenu('snacks')">🥟 Snacks</button>
                <button class="btn" onclick="filterMenu('Momos')">🥟 Momos</button>
                <button class="btn" onclick="filterMenu('chinese')">🍝 Chinese</button>
            </div>

            <!-- Dynamic Cards Container -->
            <div class="cards" id="menu-container">
                <p style="text-align: center; color: #666; grid-column: 1/-1;">Brewing conversation items from backend...</p>
            </div>
        </section>

        <div style="text-align:center; margin-top:50px;">
            <a href="index.html" class="btn">
                ⬅ Back to Home
            </a>
        </div>
    </div>

    <!-- =========================
            AUTH MODAL (LOGIN / REGISTER)
    ========================== -->
    <div id="loginModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔑 Account Access</h3>
                <button class="close-btn" onclick="closeLoginModal()">✕</button>
            </div>
            
            <!-- Tab Switcher -->
            <div style="display: flex; gap: 10px; margin: 15px 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" style="flex: 1; padding: 8px; border: none; background: #ff6600; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Login</button>
                <button id="regTabBtn" onclick="switchAuthTab('register')" style="flex: 1; padding: 8px; border: 1px solid #ccc; background: #f5f5f5; color: #333; border-radius: 4px; cursor: pointer; font-weight: bold;">Register</button>
            </div>

            <div class="modal-body" style="padding: 10px 0;">
                <!-- Existing User Login Form -->
                <form id="loginFormSection" onsubmit="handleLogin(event)">
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Phone Number</label>
                        <input type="tel" id="loginPhone" required placeholder="Enter registered phone number" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
                    </div>
                    <button type="submit" class="checkout-btn">Login to Continue</button>
                </form>

                <!-- New User Registration Form -->
                <form id="regFormSection" onsubmit="handleRegister(event)" style="display: none;">
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Full Name</label>
                        <input type="text" id="regName" required placeholder="Enter your full name" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Phone Number</label>
                        <input type="tel" id="regPhone" required placeholder="Enter mobile number" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
                    </div>
                    <button type="submit" class="checkout-btn" style="background-color: #0284c7;">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- =========================
            CART MODAL
    ========================== -->
    <div id="cartModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛍️ Your Cart Items</h3>
                <button class="close-btn" onclick="closeCartModal()">✕</button>
            </div>
            <div class="modal-body">
                <ul id="cartItemsList" class="cart-item-list">
                    <!-- Dynamic Cart Rows Rendered Here -->
                </ul>
            </div>
            <div class="modal-footer">
                <div class="total-section">
                    <span>Grand Total:</span>
                    <span id="cartTotalAmount">₹0.00</span>
                </div>
                <button class="checkout-btn" onclick="confirmOrder()">Confirm Order 🚀</button>
            </div>
        </div>
    </div>

    <!-- =========================
        DYNAMIC API INTEGRATION
    ========================== -->
    <script>
        let localMenuItems = [];

        // Fetch dynamic menu matrix from backend Flask API
        fetch("/api/menu")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                localMenuItems = data;
                renderMenu(localMenuItems);
            })
            .catch(error => {
                console.error("Error fetching dynamic menu matrix:", error);
                document.getElementById("menu-container").innerHTML = `
                    <p style="text-align: center; color: red; grid-column: 1/-1; font-weight: bold;">
                        Failed to load dynamic data from backend API!
                    </p>
                `;
            });

        function renderMenu(items) {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #666; grid-column: 1/-1;">No items found in this category.</p>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                
                const safeName = item.name.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="emoji">${item.emoji || '🍽️'}</div>
                    <h3>${item.name}</h3>
                    <p>${item.description || 'Authentic political dialogue starter'}</p>
                    <span style="display:block; margin-bottom: 10px;">₹${item.price}</span>
                    <button class="add-cart-btn" onclick="addToCart('${safeName}', ${item.price})">🛒 Add to Cart</button>
                `;
                container.appendChild(card);
            });
        }

        function filterMenu(category) {
            if (category === 'all') {
                renderMenu(localMenuItems);
            } else {
                const filtered = localMenuItems.filter(item => 
                    item.category && item.category.toLowerCase() === category.toLowerCase()
                );
                renderMenu(filtered);
            }
        }
    </script>

    <!-- Global JS App Script -->
    <script src="js/app.js"></script>
</body>

</html>
