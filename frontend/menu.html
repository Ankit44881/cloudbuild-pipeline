<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Politics Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Custom styling for User Details Bar & Cart Section */
        .user-info-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .user-info-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .user-info-inputs input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        .add-cart-btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        .add-cart-btn:hover {
            background-color: #e65c00;
        }
        .cart-status {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- =========================
            NAVBAR
    ========================== -->
    <nav>
        <div class="logo">
            <img src="images/logo.jpeg" alt="Chai Politics Logo">
            <span>CHAI POLITICS</span>
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html" style="color:#ff6600;">Menu</a></li>
            <li><a href="deployment.html">Deployment</a></li>
        </ul>
    </nav>

    <!-- =========================
            MENU SECTION
    ========================== -->
    <div class="container">
        
        <!-- User Details Section -->
        <div class="user-info-section">
            <h3>👤 Enter Details to Order</h3>
            <p style="font-size: 0.9em; color: #666;">Provide details to automatically link your items in the backend database.</p>
            <div class="user-info-inputs">
                <input type="text" id="userName" placeholder="Full Name *" required>
                <input type="email" id="userEmail" placeholder="Email Address *" required>
                <input type="tel" id="userPhone" placeholder="Phone Number *" required>
            </div>
            <div id="cartMessage" style="margin-top: 10px; font-weight: bold;"></div>
        </div>

        <section class="menu-section">
            <h2>🍽️ Our Special Menu</h2>
            
            <!-- Category Filter Buttons -->
            <div style="text-align:center; margin:30px 0;">
                <button class="btn" onclick="filterMenu('all')">All Items</button>
                <button class="btn" onclick="filterMenu('tea')">☕ Tea</button>
                <button class="btn" onclick="filterMenu('snacks')">🥟 Snacks</button>
                <button class="btn" onclick="filterMenu('Momos')">🥟 Momos</button>
                <button class="btn" onclick="filterMenu('chinese')">🍝 Chinese</button>
            </div>

            <!-- Dynamic Cards Container -->
            <div class="cards" id="menu-container">
                <p style="text-align: center; color: #666; grid-column: 1/-1;">Brewing conversation items from backend...</p>
            </div>
        </section>

        <div style="text-align:center; margin-top:50px;">
            <a href="index.html" class="btn">
                ⬅ Back to Home
            </a>
        </div>
    </div>

    <!-- =========================
        DYNAMIC API INTEGRATION
    ========================== -->
    <script>
        let localMenuItems = [];

        // Auto-fill existing user info from localStorage if present
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("user_name")) document.getElementById("userName").value = localStorage.getItem("user_name");
            if (localStorage.getItem("user_email")) document.getElementById("userEmail").value = localStorage.getItem("user_email");
            if (localStorage.getItem("user_phone")) document.getElementById("userPhone").value = localStorage.getItem("user_phone");
        });

        // Dynamic fetch using relative path
        fetch("/api/menu")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                localMenuItems = data;
                renderMenu(localMenuItems);
            })
            .catch(error => {
                console.error("Error fetching dynamic menu matrix:", error);
                document.getElementById("menu-container").innerHTML = `
                    <p style="text-align: center; color: red; grid-column: 1/-1; font-weight: bold;">
                        Failed to load dynamic data from backend API!
                    </p>
                `;
            });

        // Function to build elements dynamically matching style.css structural patterns
        function renderMenu(items) {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #666; grid-column: 1/-1;">No items found in this category.</p>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                
                // Escaping item name for onclick safety
                const safeName = item.name.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="emoji">${item.emoji || '🍽️'}</div>
                    <h3>${item.name}</h3>
                    <p>${item.description || 'Authentic political dialogue starter'}</p>
                    <span style="display:block; margin-bottom: 10px;">₹${item.price}</span>
                    <button class="add-cart-btn" onclick="addToCart('${safeName}', ${item.price})">🛒 Add to Cart</button>
                `;
                container.appendChild(card);
            });
        }

        // Filter engine matching dynamic keys mapping
        function filterMenu(category) {
            if (category === 'all') {
                renderMenu(localMenuItems);
            } else {
                const filtered = localMenuItems.filter(item => 
                    item.category && item.category.toLowerCase() === category.toLowerCase()
                );
                renderMenu(filtered);
            }
        }

        // Add to Cart Database Interaction Function
        function addToCart(itemName, price) {
            const userName = document.getElementById("userName").value.trim();
            const userEmail = document.getElementById("userEmail").value.trim();
            const userPhone = document.getElementById("userPhone").value.trim();
            const messageBox = document.getElementById("cartMessage");

            // Validate User Identity
            if (!userName || !userEmail || !userPhone) {
                alert("Please fill in your Name, Email, and Phone Number before adding items to cart!");
                document.getElementById("userName").focus();
                return;
            }

            // Save to LocalStorage for future convenience
            localStorage.setItem("user_name", userName);
            localStorage.setItem("user_email", userEmail);
            localStorage.setItem("user_phone", userPhone);

            messageBox.style.color = "#333";
            messageBox.innerText = `Adding ${itemName} to database...`;

            // POST to backend API
            fetch("/api/cart", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_name: userName,
                    user_email: userEmail,
                    user_phone: userPhone,
                    item_name: itemName,
                    price: price,
                    quantity: 1
                })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Failed to store item in database");
                }
                return res.json();
            })
            .then(data => {
                messageBox.style.color = "green";
                messageBox.innerText = `✅ ${itemName} added to cart for ${userName}!`;
                setTimeout(() => { messageBox.innerText = ""; }, 3000);
            })
            .catch(err => {
                console.error("Error adding to cart:", err);
                messageBox.style.color = "red";
                messageBox.innerText = "❌ Failed to save item in Database!";
            });
        }
    </script>
</body>

</html>
