steps:
 
  
  # 1 ROLLABCK Backend to SPECIFIC TAG
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=kubernetes/backend-deploy.yaml
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/order-backend:${_IMAGE_TAG}
      - --location=us-central1-a
      - --cluster=gke-cluster
      - --output=output/backend

  # 2 ROLLBACK FRONTEND TO SPECIFIC TAG
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=kubernetes/front-deploy.yaml
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/order-frontend:${_IMAGE_TAG}
      - --location=us-central1-a
      - --cluster=gke-cluster
      - --output=output/frontend


options:
  logging: CLOUD_LOGGING_ONLY