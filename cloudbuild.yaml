steps:
  # ---------------------------------------------------------
  # 1. FRONTEND: Generate Dynamic version.json
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IST_TIME=$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).strftime('%Y-%m-%d %I:%M:%S %p IST'))")
        
        cat > ./frontend/version.json <<EOF
        {
          "application": "Chai Politics",
          "version": "1.0.$BUILD_ID",
          "imageTag": "$SHORT_SHA",
          "commit": "$SHORT_SHA",
          "environment": "Production",
          "cluster": "$_CLUSTER",
          "deployedAt": "$$IST_TIME"
        }
        EOF

  # ---------------------------------------------------------
  # 2. BUILD & PUSH DOCKER IMAGES
  # ---------------------------------------------------------
  # Frontend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/frontend-image:$SHORT_SHA'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/frontend-image:$SHORT_SHA'

  # Backend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/backend-image:$SHORT_SHA'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/backend-image:$SHORT_SHA'

  # ---------------------------------------------------------
  # 3. DEPLOY VIA GKE-DEPLOY (Handles auth, image tag swap & rollout checks)
  # ---------------------------------------------------------
  # Deploy Frontend
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=kubernetes/front-deploy.yaml
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/frontend-image:$SHORT_SHA
      - --location=$_LOCATION
      - --cluster=$_CLUSTER
      - --output=output/frontend

  # Deploy Backend
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=kubernetes/backend-deploy.yaml
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/om-app-repo/backend-image:$SHORT_SHA
      - --location=$_LOCATION
      - --cluster=$_CLUSTER
      - --output=output/backend

  # ---------------------------------------------------------
  # 4. OBSERVABILITY: Fetch Cluster Auth & Print Live Status
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Fetch Cluster Credentials for kubectl
        gcloud container clusters get-credentials $_CLUSTER --zone $_LOCATION --project $PROJECT_ID
        
        # 2. Print Live Resources
        echo "=== LIVE PODS ==="
        kubectl get pods -o wide
        echo "=== LIVE SERVICES ==="
        kubectl get svc
        echo "=== LIVE INGRESS ==="
        kubectl get ingress

substitutions:
  _LOCATION: 'us-central1-a'
  _CLUSTER: 'gke-cluster'

options:
  logging: CLOUD_LOGGING_ONLY
