steps:
  # ---------------------------------------------------------
  # 1. FRONTEND: Generate Dynamic version.json
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IST_TIME=$$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).strftime('%Y-%m-%d %I:%M:%S %p IST'))")
        
        cat > ./frontend/version.json <<EOF
        {
          "application": "Chai Politics",
          "version": "1.0.$BUILD_ID",
          "imageTag": "$SHORT_SHA",
          "commit": "$SHORT_SHA",
          "environment": "Production",
          "cluster": "$_CLUSTER",
          "deployedAt": "$$IST_TIME"
        }
        EOF

  # ---------------------------------------------------------
  # 2. BUILD & PUSH DOCKER IMAGES
  # ---------------------------------------------------------
  # Frontend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_FRONTEND_IMAGE:$SHORT_SHA'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_FRONTEND_IMAGE:$SHORT_SHA'

  # Backend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_BACKEND_IMAGE:$SHORT_SHA'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_BACKEND_IMAGE:$SHORT_SHA'

  # ---------------------------------------------------------
  # 3. KUBERNETES DEPLOYMENT & OBSERVABILITY
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Fetch Cluster Credentials once
        gcloud container clusters get-credentials $_CLUSTER --zone $_LOCATION --project $PROJECT_ID
        
        # 2. Apply Base Manifests (Idempotent - syncs ports, env vars, etc.)
        kubectl apply -f kubernetes/

        # 3. Update Deployment Images directly using substitution variables
        kubectl set image deployment/frontend frontend=$_FRONTEND_IMAGE:$SHORT_SHA
        kubectl set image deployment/backend backend=$_BACKEND_IMAGE:$SHORT_SHA

        # 4. Wait for Rollouts to complete successfully
        kubectl rollout status deployment/frontend --timeout=120s
        kubectl rollout status deployment/backend --timeout=120s

        echo "------------------------------------------"
        echo "=== CURRENTLY RUNNING DEPLOYMENT IMAGES ==="
        echo "Frontend Image: $(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "Backend Image:  $(kubectl get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "------------------------------------------"

        # 5. Print Live Resources Status
        echo "=== LIVE PODS ==="
        kubectl get pods -o wide
        echo "=== LIVE SERVICES ==="
        kubectl get svc
        echo "=== LIVE INGRESS ==="
        kubectl get ingress

substitutions:
  _LOCATION: 'us-central1-a'
  _CLUSTER: 'gke-cluster'
  _FRONTEND_IMAGE: 'us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/frontend-image'
  _BACKEND_IMAGE: 'us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/backend-image'

options:
  logging: CLOUD_LOGGING_ONLY