steps:
  # ---------------------------------------------------------
  # 1. AUTOMATED UNIT TESTS (pytest)
  # ---------------------------------------------------------
  - name: 'python:3.10-slim'
    id: 'Run Unit Tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r backend/requirements.txt pytest
        pytest backend/tests/ --doctest-modules

  # ---------------------------------------------------------
  # 2. SONARQUBE SAST SCAN
  # ---------------------------------------------------------
  - name: 'sonarsource/sonar-scanner-cli:latest'
    id: 'SonarQube Scan'
    env:
      - 'SONAR_HOST_URL=http://35.192.204.99:9000'
      - 'SONAR_TOKEN=$_SONAR_TOKEN'
    args:
      - '-Dsonar.projectKey=chai-politics'
      - '-Dsonar.sources=backend'
      - '-Dsonar.exclusions=**/venv/**,**/tests/**'

  # ---------------------------------------------------------
  # 3. FRONTEND: Generate Dynamic version.json
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IST_TIME=$$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).strftime('%Y-%m-%d %I:%M:%S %p IST'))")
        
        cat > ./frontend/version.json <<EOF
        {
          "application": "Chai Politics",
          "version": "1.0.$BUILD_ID",
          "imageTag": "$SHORT_SHA",
          "commit": "$SHORT_SHA",
          "environment": "Production",
          "cluster": "$_CLUSTER",
          "deployedAt": "$$IST_TIME"
        }
        EOF

  # ---------------------------------------------------------
  # 4. BUILD & PUSH DOCKER IMAGES
  # ---------------------------------------------------------
  # Frontend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_FRONTEND_IMAGE:$SHORT_SHA'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_FRONTEND_IMAGE:$SHORT_SHA'

  # Backend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_BACKEND_IMAGE:$SHORT_SHA'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_BACKEND_IMAGE:$SHORT_SHA'

  # ---------------------------------------------------------
  # 5. KUBERNETES DEPLOYMENT & STATEFUL INFRASTRUCTURE
  # ---------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Fetch Cluster Credentials
        gcloud container clusters get-credentials $_CLUSTER --zone $_LOCATION --project $PROJECT_ID
        
        # 2. Apply Kubernetes Manifests (Secrets, Services, StatefulSets, Deployments)
        kubectl apply -f kubernetes/ --recursive

        # 3. Wait for MySQL StatefulSet readiness before rolling out backend
        echo "=== WAITING FOR MYSQL STATEFULSET ==="
        kubectl rollout status statefulset/mysql --timeout=180s

        # 4. Auto-initialize Database Schema if needed
        echo "=== CHECKING & INITALIZING DATABASE SCHEMA ==="
        kubectl exec -i mysql-0 -- mysql -u chai_admin -pUserPassword123 chaipolitics_db < database/schema.sql || true

        # 5. Update Deployments with new container images
        kubectl set image deployment/frontend frontend=$_FRONTEND_IMAGE:$SHORT_SHA
        kubectl set image deployment/backend backend=$_BACKEND_IMAGE:$SHORT_SHA

        # 6. Wait for App Rollouts to complete
        kubectl rollout status deployment/frontend --timeout=120s
        kubectl rollout status deployment/backend --timeout=120s

        echo "------------------------------------------"
        echo "=== CURRENTLY RUNNING DEPLOYMENT IMAGES ==="
        echo "Frontend Image: $(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "Backend Image:  $(kubectl get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "------------------------------------------"

        # 7. Print Live Resources Status
        echo "=== LIVE PODS ==="
        kubectl get pods -o wide
        echo "=== LIVE PVC & STATEFULSETS ==="
        kubectl get pvc,statefulset
        echo "=== LIVE SERVICES & INGRESS ==="
        kubectl get svc,ingress

substitutions:
  _LOCATION: 'us-central1-a'
  _CLUSTER: 'gke-cluster'
  _FRONTEND_IMAGE: 'us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/frontend-image'
  _BACKEND_IMAGE: 'us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/backend-image'
  _SONAR_TOKEN: squ_1ec3842857d5d05fd76dc1d4be5e0b38f90a2991  

options:
  logging: CLOUD_LOGGING_ONLY