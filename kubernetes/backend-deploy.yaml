apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend  # Deployment name changed to backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chai-backend
  template:
    metadata:
      labels:
        app: chai-backend
    spec:
      containers:
      - name: backend  # Container name changed to backend
        image: us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/order-backend:latest
        ports:
        - containerPort: 5000